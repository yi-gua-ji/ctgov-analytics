[project]
name = "ctgov-analytics"
version = "0.1.0"
description = "ClinicalTrials.gov cardiometabolic trials: ingestion, warehouse, metrics and statistical analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
dashboard = ["streamlit>=1.36"]

[project.scripts]
cta-pipeline = "cta.etl.run:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"